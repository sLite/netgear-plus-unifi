# Shared configuration for netgear-plus-unifi.
#
# Each switch has two sections:
#   source: the PHYSICAL NETGEAR switch (read by the collector; written only
#           if source.write is enabled)
#   unifi:  the VIRTUAL UniFi device (presented by the emulator); its MAC is
#           either the NETGEAR's own (mac: physical) or a derived virtual one.
# Passwords never go in this file: source.password_env names the environment
# variable that holds it.

collector:
  listen: "0.0.0.0:8099"          # internal API used by the emulator
  poll_interval_seconds: 15       # default per-switch polling interval
  stale_after_seconds: 90         # snapshot older than this = unavailable
  state_dir: "/data"              # provisioning state (VLANs created by this integration)

emulator:
  # Controller inform endpoint. Disposable test controller (docker-compose.test.yml):
  #   http://unifi-controller:8080/inform
  # Dream Router 7 (only after explicit approval, see docs/DEPLOYMENT.md):
  #   http://192.168.1.1:8080/inform
  inform_url: "http://unifi-controller:8080/inform"
  collector_url: "http://collector:8099"
  state_dir: "/data"              # adoption state, contains auth keys (0600)
  inform_interval_seconds: 10     # controller may retune this
  telemetry_poll_seconds: 5
  stale_after_seconds: 90         # stop informing -> UniFi shows switch offline

switches:
  - id: gs308ev4                  # stable id; renaming it creates a new virtual device
    source:
      adapter: netgear_plus       # or "mock" (see below)
      host: 192.168.1.247
      password_env: NETGEAR_GS308EV4_PASSWORD
      expected_model: GS308Ev4    # refuse to report data if another model answers
      poll_interval_seconds: 15
      # Let UniFi manage this switch's ports (VLANs, native VLAN, disable,
      # speed, name), like a native UniFi switch. Off unless enabled;
      # dry_run only logs the plan. Review the plan before going live.
      write:
        enabled: false
        dry_run: true
    unifi:
      model: USL8LP               # USW Lite 8 PoE: 8x GE; PoE reported absent per port
      # physical: the NETGEAR's own MAC, so the gateway sees the device's
      # identity on the wire (lets UniFi place it in the topology).
      # auto: derived 02:4e:47:xx:xx:xx (locally administered, never on the wire).
      # Changing this means forgetting and re-adopting the device in UniFi.
      mac: physical
      name: "GS308Ev4"
      ip: physical                # report the NETGEAR management IP

  - id: gs116ev2
    source:
      adapter: netgear_plus
      host: 192.168.1.230
      password_env: NETGEAR_GS116EV2_PASSWORD
      expected_model: GS116Ev2
      write:
        enabled: false
        dry_run: true
    unifi:
      model: USL16LP              # UniFi Switch Lite 16 PoE: 16x GE; PoE reported absent
      mac: physical
      name: "GS116Ev2"
      ip: physical
      # Optional, operator-declared topology (never detected; see docs/REPORT.md):
      # downlinks:
      #   - {port: 2, switch: gs308ev4}   # the GS308Ev4 hangs off port 2

  # Development without hardware:
  # - id: mock-16
  #   source:
  #     adapter: mock
  #     mock: {model: GS116Ev2, seed: 7, flap_port: 3, flap_period_seconds: 120, failure_rate: 0.05}
  #   unifi:
  #     model: USL16LP
