# netgear-plus-unifi: NETGEAR Plus switches as UniFi switches.
#
#   cp .env.example .env && cp config/switches.example.yaml config/switches.yaml
#   docker compose up -d --build                     # against the controller in switches.yaml
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#                                                    # against a disposable test controller
name: netgear-plus-unifi

services:
  netgear-unifi:
    build: .
    restart: unless-stopped
    env_file: .env # NETGEAR_*_PASSWORD
    environment:
      CONFIG_FILE: /config/switches.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UNIFI_INFORM_URL: ${UNIFI_INFORM_URL:-} # empty = controller.inform_url from the config
    volumes:
      - ${SWITCHES_CONFIG:-./config/switches.yaml}:/config/switches.yaml:ro
      - state:/data
    ports:
      - "127.0.0.1:8098:8098" # read-only status endpoint

volumes:
  state: # adoption state incl. controller auth keys; `docker compose down -v` removes it
