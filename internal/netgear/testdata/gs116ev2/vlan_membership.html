function checkPreviousConf()
{
	var url = window.location.toString();
	
	if (url.indexOf('?') != -1)
	{
		var ary = url.split('?')[1];	
	    document.getElementById('selVidSel').value = ary;
	    
	    for(var i=0; i<vlanMemEntry.length; i++)
	    {
	        var vidIndex = vlanMemEntry[i].split('?')[0];
	        if(vidIndex == ary)
	        {
	            changeVlanId(i);
	        }
	    }
		
		// Disable button on control bar
        document.getElementById('btnApply').className = 'unclickbtnStyle';
        document.getElementById('btnApply').setAttribute('href', 'javascript:void(0)');

        // Disable button on control bar
        document.getElementById('btnCancel').className = 'unclickbtnStyle';
        document.getElementById('btnCancel').setAttribute('href', 'javascript:void(0)');
	}
	else
	{
	    changeVlanId(0);
	    
	    // Disable button on control bar
        document.getElementById('btnApply').className = 'unclickbtnStyle';
        document.getElementById('btnApply').setAttribute('href', 'javascript:void(0)');

        // Disable button on control bar
        document.getElementById('btnCancel').className = 'unclickbtnStyle';
        document.getElementById('btnCancel').setAttribute('href', 'javascript:void(0)');
	}
}

function submitForm()
{   
    var ele = parent.createDivEle('tmp', '', '');
    var vid = document.getElementById('selVidSel').value;
    var member = 0, tagMember = 0;
    var pvidArr = pvid.split('?');
    var memArr = memStatus.split('?');
    var GroupMemArr =new Array();
    
    for(var portIndex=1; portIndex<=portNum; portIndex++)
    {
        if(memArr[portIndex - 1] != '0')
        {
            member += (1 << portIndex);
			GroupMemArr[portIndex-1] = memArr[portIndex - 1];
        }
        
        if(memArr[portIndex - 1] == 'T')
        {
            tagMember += (1 << portIndex);
        }
    }
	
	if(checkConfig(memArr) == 0)
	{
		return;
	}

	for(var portIndex=1; portIndex<=portNum; portIndex++)
    {
        if(memArr[portIndex - 1] == '0')
        {
            if(pvidArr[portIndex - 1] == document.getElementById('selVidSel').value)
            {
                parent.showDialogWithAlert(parent.Vlan0002, parent.ErrorCode0067_1 + portIndex + parent.ErrorCode0067_2);
                return;
            }
        }
    }
	
    ele.appendChild(parent.createInputEle('vid', 'vid', 'hidden', '', vid, '', ''));
    ele.appendChild(parent.createInputEle('member', 'member', 'hidden', '', member, '', ''));
    ele.appendChild(parent.createInputEle('tag', 'tag', 'hidden', '', tagMember, '', ''));

	// Disable input texts to prevent submission
    document.getElementById('selVidSel').disabled = 'disabled';
    document.getElementById('selGOperSel').disabled = 'disabled';
	
    // Create hidden inputs
    document.getElementById('vlanMemBlkBArea').appendChild(ele);
    document.getElementById('formArea').submit();    
}

function checkConfig(GroupMemArr)
{
	// Check Trunk
	for(var lagId=0; lagId<groupNum; lagId++)
	{
		var lagMems = (lagMemEntry[lagId].split('?'))[2].split(',');
    	var cmpBaseVlan = GroupMemArr[lagMems[0] - 1];
		var admin = lagMemEntry[lagId].split('?')[1];

		if(admin == parent.System0013)
			continue;
		for(var i=1; i<lagMems.length; i++)
		{
			var cmpTargetVlan = GroupMemArr[lagMems[i] - 1];
           
			if(cmpBaseVlan != cmpTargetVlan)
			{
				parent.showDialogWithAlert(parent.Vlan0002, parent.ErrorCode0068);
				return 0;
			}
		}
	}	
	return 1;
}

function changeGroupOperation(act)

            document.getElementById('port' + portIndex + untagHoverImgId).setAttribute('style', 'display: none;');
            memStatus += 'U?';
        }

    else if(act == 'Tag All')
    {

            document.getElementById('port' + portIndex + untagImgId).setAttribute('style', 'display: none;');
            document.getElementById('port' + portIndex + untagHoverImgId).setAttribute('style', 'display: none;');
            memStatus += 'T?';
        }
    }
    else if(act == 'Remove All')
    {
        for(var i=0; i<portNum; i++)
        {
            var portIndex = i + 1;
            document.getElementById('port' + portIndex + blandImgId).setAttribute('style', 'display: block;');
            document.getElementById('port' + portIndex + tagImgId).setAttribute('style', 'display: none;');

            document.getElementById('port' + portIndex + untagHoverImgId).setAttribute('style', 'display: none;');

    }

function portCheck(port)
{   
    var portIndex = port;
    var portAction = 0;
    var memStatusArr = memStatus.split('?');
    
    enableControl();
    
    if(memStatusArr[port - 1] == '0')
    {
        document.getElementById('port' + portIndex + blandImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + blandImgHoverId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + tagImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + tagHoverImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + untagImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + untagHoverImgId).setAttribute('style', 'display: block;');
        portAction = 'U';
    }
    else if(memStatusArr[port - 1] == 'U')
    {
        document.getElementById('port' + portIndex + blandImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + blandImgHoverId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + tagImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + tagHoverImgId).setAttribute('style', 'display: block;');
        document.getElementById('port' + portIndex + untagImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + untagHoverImgId).setAttribute('style', 'display: none;');
        portAction = 'T';
    }
    else if(memStatusArr[port - 1] == 'T')
    {   
        document.getElementById('port' + portIndex + blandImgId).setAttribute('style', 'display: block;');
        document.getElementById('port' + portIndex + blandImgHoverId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + tagImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + tagHoverImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + untagImgId).setAttribute('style', 'display: none;');
        document.getElementById('port' + portIndex + untagHoverImgId).setAttribute('style', 'display: none;');
        portAction = '0';
    }
        
    // rebuild 'memStatus'
    var memArr = memStatus.split('?');
    memStatus = '';
    memArr[port - 1] = portAction;
    for(var i=0; i<portNum; i++)
    {
        if(memArr[i] != '')
        {
            memStatus += memArr[i] + '?';
        }
        else
        {
            memStatus += '?';
        }
    }
}
